agents:
  - name: planner
  - name: builder
    manual_shell: true
  - name: reviewer

managed_hooks:
  pre-commit: .git-pre-commit-hook

tmux:
  # session_name defaults to the project name; set it to override.
  prompt_send_delay: 1.0  # seconds to wait after window switch before send-keys

states:
  intent:
    description: Plans being explored.
    agent: planner
    commands:
      - command_type: script
        name: new
        description: Create a new intent file.
        script: new
        reminder: "git commit, then workflow push"
      - command_type: script
        name: push
        description: Push pending content to canon.
        script: push
        worktree_override: canon
        pull_target: planner
        reminder: ask
      - command_type: prompt
        name: architecture
        description: Read the idea; discuss critical architectural choices.
        prompt: |
          We are starting a new project from a cookiecutter template.
          Before we start planning the implementation sequence,
          let's discuss the overall architecture, pinning down any critical architectural choices.

          Start by reading the project idea at `{{ plans_root_in_worktree }}/intent/001_idea.md`.
          Ask any questions until you have a clear understanding.
          Propose alternative approaches for any open questions, listing pros and cons.
          Point out gaps, additional architectural decisions that should be made a this point.

          Let's avoid descending too low into details:
          we don't need the specs to be complete at this point, instead focusing on the high-impact decisions.

          Once ambiguities have been cleared up and decisions have been made,
          write the fleshed out architecture document into `{{ plans_root_in_worktree }}/planning/002_architecture.md`.
        reminder: mvp
      - command_type: prompt
        name: mvp
        description: Create a plan sequence for the MVP slice
        prompt: |
          Read the plans at `{{ plans_root_in_worktree }}/intent/001_idea.md` and `{{ plans_root_in_worktree }}/planning/002_architecture.md`.
          Begin by asking any questions, until you have a clear understanding.

          We'll create plans for the MVP slice.
          Begin by determining which features to include in the MVP; ask if unclear.
          Then break the work down into several detailed implementation plans.
          Write each plan into `{{ plans_root_in_worktree }}/planning/`.
          Use running numbers starting from 3, e.g. `{{ plans_root_in_worktree }}/planning/003_foo.md` and `{{ plans_root_in_worktree }}/planning/004_bar.md`

          Commit your changes.
        reminder: critique
      - command_type: prompt
        name: ask
        description: Read the plan; ask clarifying questions.
        prompt: |
          Read the plan at {{ plan.path_in_worktree }}.
          Ask any questions until you have a clear understanding.
        reminder: critique
      - command_type: manual
        name: answer
        description: Human answers questions in chat.
      - command_type: prompt
        name: critique
        description: Critique the plan.
        prompt: |
          Read the plan at {{ plan.path_in_worktree }}.
          Critique the idea.
          Please be honest, even harsh if necessary.
          Point out any flaws or weak points in the design.
          Point out any decisions that have a high risk of becoming technical debt.
          Propose additional features, to improve the effectiveness, robustness, and usability of the system.
        reminder: plan or subdivide
      - command_type: manual
        name: revise
        description: Human revises the plan.
      - command_type: prompt
        name: plan
        description: Write a detailed plan from an intent.
        prompt: |
          Read the intent at {{ plan.path_in_worktree }}.
          Write a detailed implementation plan into {{ plans_root_in_worktree }}/planning/.
          Commit your changes.
        transition: planning
        reminder: critique
      - command_type: prompt
        name: subdivide
        description: Break the plan into smaller planning documents.
        prompt: |
          Read the plan at {{ plan.path_in_worktree }}.
          Break it down into several detailed implementation plans.
          Write each plan into `{{ plans_root_in_worktree }}/planning/`.
          Use running numbers in a hierarchy below the input plan,
          e.g. `{{ plans_root_in_worktree }}/planning/{{ plan.sequence_number_str }}.1_foo.md` and `{{ plans_root_in_worktree }}/planning/{{ plan.sequence_number_str }}.2_bar.md`
          Commit your changes.
        transition: planning
        reminder: critique

  planning:
    description: Plans being drafted.
    agent: planner
    commands:
      - command_type: manual
        name: adjust
        description: Human edits the plan directly.
      - command_type: prompt
        name: critique
        description: Critique the plan.
        prompt: |
          Read the plan at {{ plan.path_in_worktree }}.
          Critique the plan.
          Please be honest, even harsh if necessary.
          Point out any flaws or weak points in the design.
          Point out any decisions that have a high risk of becoming technical debt.
          Is this plan well scoped to proceed to building, or should it be subdivided?
        reminder: todo
      - command_type: manual
        name: revise
        description: Human revises the plan.
      - command_type: prompt
        name: rebase
        description: Rebase the working branch onto current main.
        prompt: &rebase_prompt |
          The branch {{ branch }} can no longer be fast-forward merged into `main`,
          and the automatic rebase hit conflicts.
          Fetch from bare and rebase {{ branch }} onto `bare/main`.
          Resolve the conflicts, preserving the intent of both sides; do not drop changes from `main`.
          Run the pre-commit hook and make sure it passes.
          Do not push: you have no write access to the shared repository.
        reminder: validate
      - command_type: script
        name: validate
        description: Run verification checks.
        script: validate
        reminder: todo or reject
      - command_type: script
        name: todo
        description: Approve for implementation.
        script: todo
        transition: todo
        reminder: implement

  todo:
    description: Plans approved for implementation.
    agent: null
    commands:
      - command_type: script
        name: implement
        description: Start implementation.
        script: implement
        transition: implementing
        also_valid_in_states: [planning]
        reminder: ask
      - command_type: script
        name: push
        description: Push pending content to canon.
        script: push
        worktree_override: canon

  implementing:
    description: Plans under active implementation.
    agent: builder
    commands:
      - command_type: prompt
        name: ask
        description: Read the plan; ask clarifying questions.
        prompt: |
          Read the plan at {{ plan.path_in_worktree }}.
          Ask any questions until you have a clear understanding.
          Do not write code yet.
        reminder: build
      - command_type: manual
        name: answer
        description: Human answers questions in chat.
      - command_type: prompt
        name: build
        description: Implement the plan.
        prompt: |
          Read the plan at {{ plan.path_in_worktree }}.
          Work on the feature branch {{ branch }}.
          {%- if stack %}
          The branch already carries finished work for:
          {% for e in stack -%}
          {%- if not loop.last %}- {{ e.name }} ({{ e.path }}, commit range {{ e.commit_range }})
          {% endif -%}
          {%- endfor %}
          Read those plans for context only; do not re-implement or modify them.
          Implement only {{ plan.path_in_worktree }}.
          {%- else %}
          Implement the plan.
          {%- endif %}
          Commit your changes, making sure to run the pre-commit hook.
        reminder: check
      - command_type: prompt
        name: rebase
        description: Rebase the working branch onto current main.
        prompt: *rebase_prompt
        reminder: check
      - command_type: script
        name: check
        description: Run verification checks and hand off.
        script: check
        transition: checking
        reminder: manual review, then pr

  checking:
    description: Implementation complete, review in progress.
    agent: reviewer
    commands:
      - command_type: manual
        name: review
        description: Human reviews the proposed change.
      - command_type: prompt
        name: pr
        description: Write a thorough code review.
        prompt: |
          Perform a thorough code review of the changes on the {{ branch }} branch.
          The plan is at {{ plan.path_in_worktree }}.
          {%- if plan.sequence_number|length > 1 %}
          The plan is a result of subdivision:
          also read the parent plan to ensure that changes align with the big picture.{%- endif %}
          {%- if stack %}
          The branch carries the whole stack:
          {% for e in stack %}- {{ e.name }} ({{ e.path }}, commit range {{ e.commit_range }})
          {% endfor -%}
          The review covers the whole branch, but organise it per plan.
          {%- endif %}
          Write a report into {{ plans_root_in_worktree }}/reviews/pr/{{ plan.name }}_{{ commit }}.md.
          Commit your changes. Do not modify the code.
        reminder: fix
      - command_type: manual
        name: adjust
        description: Human edits the review or code directly.
      - command_type: prompt
        name: fix
        description: Fix issues from the most recent review.
        prompt: |
          Fix the issues identified in the most recent review `{{ plans_root_in_worktree }}/reviews/pr/{{ plan.name }}_*.md`.
        reminder: validate
      - command_type: prompt
        name: rebase
        description: Rebase the working branch onto current main.
        prompt: *rebase_prompt
        reminder: validate
      - command_type: script
        name: validate
        description: Run verification checks.
        script: validate
        reminder: accept or reject
      - command_type: script
        name: accept
        description: Accept and merge to main.
        script: accept
        transition: done
      - command_type: script
        name: reject
        description: Close out without merging.
        script: reject
        transition: rejected

  done:
    description: Merged to main. Implementation and review complete.
    agent: null
    commands: []

  rejected:
    description: Will not be implemented.
    agent: null
    commands: []

  review:
    description: Special state for all reviews. Commands are codebase-wide review and audit tasks unrelated to a specific plan.
    agent: reviewer
    commands:
      - command_type: prompt
        name: full review
        description: Perform a full review of the current codebase.
        prompt: |
          Perform a full review of the current state of the codebase.
          Write a report into {{ plans_root_in_worktree }}/reviews/full/{{ today }}_{{ commit }}.md.
      - command_type: prompt
        name: followthrough
        description: Compare done plans against the codebase for unimplemented features.
        prompt: |
          Go through all plans in the states intent, checking, and done.
          Compare features against the codebase.
          List unimplemented and only partially implemented features.
          If `{{ plans_root_in_worktree }}/index_of_decisions.md` exists, also go through its deferred work section:
          remove every item that the codebase shows to be completed, and record the `main` commit
          your branch was cut from as the last followthrough pass. Do not create the index file if it does not exist.
      - command_type: prompt
        name: index_decisions
        description: Update the index of decisions from plans and intents not yet indexed.
        prompt: |
          Update the index of decisions `{{ plans_root_in_worktree }}/index_of_decisions.md`; create it if it does not exist.
          Its purpose: a planner reading only some prior plans must not miss a relevant decision, and decisions should not
          be duplicated or contradicted unknowingly. It does not pin behaviour (tests do) and does not replace reading plans:
          it tells agents which plans to read.

          Indexable files: plans in `done` and all intents. Do not read reviews, or plans in other states.
          Read every indexable file that
          - is not covered by a Plan summaries entry (as head, related file, or subplan range), or
          - changed since the last indexing pass: `git -C {{ plans_root_in_worktree }} diff --name-only --relative <hash>..HEAD -- .`
          For a changed file, update its existing entries instead of adding duplicates.

          File layout. Start the file with exactly this header, filling in the hashes:

          ```
          # Index of decisions

          Last indexing pass: `<hash>` (the `main` commit the indexing branch was cut from).
          Last followthrough pass: `<hash>` | (none)

          Selective index of decisions, deferred work, and terms from done plans and intents.
          Decisions judged trivial or local to their plan are not indexed: read the plans an entry points to
          before relying on the absence of a decision. Obsolete detection is best-effort.
          Topics are `###` headings: list them with `grep -n '^###'` and read the relevant ones.

          Identifiers: `intent/{number}_{slug}` and `{number}_{slug}` (plans, without state).
          Refer to a decision as `{identifier} Decision {n}`. In legacy files (no single numbered Decisions list),
          numbers are valid only as given here, `D–` marks an unnumbered choice, and the locator (`§heading: "quote"`)
          finds the text.

          Statuses: decisions `current` / `intended` / `superseded` (→ superseding decision) / `obsolete`;
          deferred work `open` / `dropped`; terms `current` / `superseded`.
          ```

          Then these `##` sections, in order. Keep entries to one summary line plus locator; wrap at 120 characters.
          - `## Plan summaries`, ordered by number: ``- `{head}` — {one-line summary}.`` and optionally a second line
            ``Related: {identifiers}`` (the intent, tickets) or ``Subplans {first}–{last}.``
            The head is the top-level plan if one exists, else the intent. Every file you read must end up covered by an entry.
          - `## Decisions`, grouped under `###` topic headings you choose (merge or rename topics as the index grows):
            ``- {status} `{identifier}` D{n} — {one-line summary}. §{heading}: "{short quote}"``
            The locator is needed for legacy files only.
          - `## Deferred work`: ``- {status} `{identifier}` — {summary}.`` Add `###` topics once the section grows long.
          - `## Terminology`: ``- {status} **{term}** (`{identifier}`) — {definition}.``

          Numbering. A file with one numbered `## Decisions` list uses its numbers. Legacy files are never edited; number
          their explicit decision items in file order across every decision-like list (Decisions, Design decisions,
          Clarifications, post-review decisions, …) and inline `Decision:` sentences. A file's own labels go into the locator.
          Load-bearing implicit choices in legacy files may be indexed as `D–` with a locator; elsewhere, index only
          explicit decisions.

          Statuses. `intended`: from an intent with no plan yet. `obsolete`: from an intent whose plans were all rejected,
          or about a component since removed. Supersede check: for every decision you add, search the index for decisions
          it overrides and mark them `superseded (→ {identifier} D{n})`; a withdrawn decision is marked the same way.
          A decision that only narrows an earlier one adds "narrowed by …" to the earlier entry, which stays `current`.

          Selecting decisions. The rules are heuristics and may conflict; make the call. Index a decision only if it is
          non-trivial and likely relevant outside its own plan. Pruned decisions stay unindexed.
          - A user's answer counts more, but only when they chose between real alternatives, not when confirming the obvious.
          - Rejected proposals may matter, e.g. a deliberately accepted test gap.
          - Decisions in the obvious location (the plan that introduced a subsystem) need a higher bar for impact.
            Decisions in unobvious locations (follow-ups, bug fixes, later plans) get a lower bar for impact,
            not for triviality.
          - Keep surprising definitions; omit obvious ones. Omit structural decisions ("Foo subclasses Bar",
            "Foo carries field baz") unless architecturally load-bearing.
          - Keep prohibitions a later plan could plausibly violate (e.g. agents never push); not everything phrased negatively.
            Negatives are hard to establish with code search.
          - When an intent and its plan restate decisions, index the earliest statement; index a later file only where it
            changes or adds something.
          - Superseded decisions pass the same bar as current ones. A supersession within one file is not indexed.
          Never index:
          - sequencing and scoping within a plan or a chain of subdivided plans;
          - accepting or rejecting a proposal (the proposal itself may hold decisions);
          - decisions to add particular tests;
          - content already in `{{ plans_root_in_worktree }}/intent/001_idea.md`;
          - a decision that only applies an indexed rule to one more caller or command;
          - output wording and formatting, unless something parses it or it is a user-facing contract;
          - an accepted limitation that is also a deferred work item: list it under Deferred work only.

          Deferred work: deferred, out-of-scope, and future work. Only add items; skip items you can see are done
          (`followthrough` prunes completed ones). Omit work deferred to a later part of the same subdivide chain.

          Terminology: only terms coined or given a specific meaning in a plan and used across plans or in code identifiers.
          Skip terms defined in `intent/001_idea.md`; suggest adding important ones there instead.

          Record the `main` commit your branch was cut from as the last indexing pass, and commit the index.
          In your final message, list the files you read and any borderline decisions you pruned, for human review.
      - command_type: prompt
        name: refresh
        description: Update planning/todo plans against decisions made since they were written.
        prompt: |
          Go through all plans in the states `planning` and `todo` (target plans).
          For each target plan, check against any plans in the `done` state that have been modified after the target plan.
          When needed, check against the implementation of the features in the codebase.
          List all specifications that need updating due to decisions made after the target plan was written.
            - Decisions that have since been contradicted.
            - Decisions that were initially left open, but have since been made. Remove obsolete branches.
            - Features that can be specified in more detail as dependencies have taken shape.
            - Specifications that seem suboptimal in the new context.
            - Any other necessary updates.

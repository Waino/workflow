agents:
  - name: planner
    model: opus4.6
  - name: builder
    model: sonnet4.6
  - name: reviewer
    model: gpt5.4

managed_hooks:
  pre-commit: .git-pre-commit-hook

tmux:
  session_name: workflow
  prompt_send_delay: 1.0  # seconds to wait after window switch before send-keys

states:
  intent:
    agent: planner
    commands:
      - command_type: prompt
        name: ask
        prompt: |
          Read the plan at {{ plan.path }}.
          Ask any questions until you have a clear understanding.
      - command_type: manual
        name: answer
      - command_type: prompt
        name: critique
        prompt: |
          Read the plan at {{ plan.path }}.
          Critique the idea.
          Please be honest, even harsh if necessary.
          Point out any flaws or weak points in the design.
          Point out any decisions that have a high risk of becoming technical debt.
          Propose additional features, to improve the effectiveness, robustness, and usability of the system.
      - command_type: manual
        name: revise
      - command_type: prompt
        name: plan
        prompt: |
          Read the intent at {{ plan.path }}.
          Write a detailed implementation plan into docs/plans/planning/.
        transition: planning
        reminder: critique
      - command_type: prompt
        name: subdivide
        prompt: |
          Read the plan at {{ plan.path }}.
          Break it down into several detailed implementation plans.
          Write each plan into docs/plans/planning/.
        transition: planning

  planning:
    agent: planner
    commands:
      - command_type: manual
        name: adjust
      - command_type: prompt
        name: critique
        prompt: |
          Read the plan at {{ plan.path }}.
          Critique the plan.
          Please be honest, even harsh if necessary.
          Point out any flaws or weak points in the design.
          Point out any decisions that have a high risk of becoming technical debt.
      - command_type: manual
        name: revise
      - command_type: script
        name: todo
        script: todo
        transition: todo

  todo:
    agent: null
    commands:
      - command_type: script
        name: implement
        script: implement
        transition: implementing
        reminder: ask

  implementing:
    agent: builder
    commands:
      - command_type: prompt
        name: ask
        prompt: |
          Read the plan at {{ plan.path }}.
          Ask any questions until you have a clear understanding.
      - command_type: manual
        name: answer
      - command_type: prompt
        name: build
        prompt: |
          Read the plan at {{ plan.path }}.
          Implement the plan. When done, transition the plan state to checking.
        reminder: push
      - command_type: script
        name: push
        script: push
        transition: checking
        reminder: review

  checking:
    agent: reviewer
    commands:
      - command_type: manual
        name: review
      - command_type: prompt
        name: pr
        prompt: |
          Perform a thorough code review of the changes on the {{ branch }} branch.
          The plan is at {{ plan.path }}.
          Focus on software architecture, logic errors, missing or partially implemented requirements,
          fit with existing architecture and conventions, unit test quality and coverage, and security.
          Write a report into docs/plans/reviews/pr/{{ plan.name }}_{{ commit }}.md.
          Commit your changes. Do not modify the code.
      - command_type: manual
        name: adjust
      - command_type: prompt
        name: fix
        prompt: |
          Fix the issues identified in the most recent review.
      - command_type: script
        name: doublecheck
        script: doublecheck
      - command_type: script
        name: accept
        script: accept
        transition: done
      - command_type: script
        name: reject
        script: reject
        transition: done

  done:
    agent: null
    commands: []

  rejected:
    agent: null
    commands: []

  review:
    agent: reviewer
    commands:
      - command_type: prompt
        name: full review
        prompt: |
          Perform a full review of the current state of the codebase.
          Search for dead code, propose integration tests, and review overall architecture.
          Write a report into docs/plans/reviews/full/.
      - command_type: prompt
        name: followthrough
        prompt: |
          Go through all plans in the states intent, checking, and done.
          Compare features against the codebase.
          List unimplemented and only partially implemented features.
      - command_type: prompt
        name: refresh
        prompt: |
          Go through all plans in the states `planning` and `todo` (target plans).
          For each target plan, check against any plans in the `done` state that have been modified after the target plan.
          When needed, check against the implementation of the features in the codebase.
          List all specifications that need updating due to decisions made after the target plan was written.
            - Decisions that have since been contradicted.
            - Decisions that were initially left open, but have since been made. Remove obsolete branches.
            - Features that can be specified in more detail as dependencies have taken shape.
            - Specifications that seem suboptimal in the new context.
            - Any other necessary updates.

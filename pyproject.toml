[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "workflow"
authors = [
    {name = "Stig-Arne Grönroos", email="stig.gronroos@gmail.com"}
]
readme = "README.rst"
license = "MIT"
dynamic = ["version", "description"]
classifiers = [ "Development Status :: 4 - Beta",
                "Intended Audience :: Science/Research",
                "Operating System :: OS Independent",
                "Programming Language :: Python",
                "Topic :: Scientific/Engineering",
                "Private :: Do Not Upload", ]
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
]

[project.urls]
Documentation = "https://workflow.readthedocs.io"
Source = "https://github.com/waino/workflow"

[project.scripts]
workflow = "workflow:main"

[tool.black]
line-length = 120

[tool.pytest.ini_options]
addopts = "-v --cov=workflow --cov-report html --ignore-glob docs/**"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
# T201: print
ignore = [
    "ANN401",
    "D401",
    "D412",
    "D413",
    "FBT002",
    "FIX001",
    "FIX002",
    "PERF203",
    "PGH003",
    "RET504",
    "S101",
    "SIM108",
    "TD001",
    "TD002",
    "TD003",
    "TRY002",
    "TRY003",
    "TRY301",
    "UP015",
    "T201",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "coverage>=7.13.5",
    "flit>=3.12.0",
    "ipython>=8.38.0",
    "mypy>=1.19.1",
    "mypy-extensions>=1.1.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
    "sphinx>=8.1.3",
]

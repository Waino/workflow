[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
include = ["docs/default_config.yaml"]

[project]
name = "workflow"
authors = [
    {name = "Stig-Arne Grönroos", email="stig.gronroos@gmail.com"}
]
readme = "README.rst"
license = "MIT"
dynamic = ["version", "description"]
classifiers = [ "Development Status :: 4 - Beta",
                "Intended Audience :: Science/Research",
                "Operating System :: OS Independent",
                "Programming Language :: Python",
                "Topic :: Scientific/Engineering",
                "Private :: Do Not Upload", ]
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.1",
    "jinja2>=3.1.6",
    "libtmux>=0.55.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
]

[project.urls]
Documentation = "https://workflow.readthedocs.io"
Source = "https://github.com/waino/workflow"

[project.scripts]
workflow = "workflow:main"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.pytest.ini_options]
addopts = "-v --cov=workflow --cov-report html --ignore-glob docs/**"
markers = ["slow: low-value or redundant tests skipped by the pre-commit hook; plain `pytest` runs them"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["ALL"]
# T201: print
ignore = [
    "ANN401",
    "D401",
    "D412",
    "D413",
    "D203",
    "D213",
    "FBT002",
    "FIX001",
    "FIX002",
    "PERF203",
    "PGH003",
    "RET504",
    "S101",
    "SIM108",
    "TD001",
    "TD002",
    "TD003",
    "TRY002",
    "TRY003",
    "TRY301",
    "UP015",
    "TC001",
    "T201",
]

[tool.ruff.lint.per-file-ignores]
"**/{tests}/*" = ["INP001", "BLE001", "PLR2004", "S101", "SLF001", "E402", "D100", "D101", "D102", "D103", "S108"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "coverage>=7.13.5",
    "flit>=3.12.0",
    "ipython>=8.38.0",
    "mypy>=1.19.1",
    "mypy-extensions>=1.1.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.6",
    "sphinx>=8.1.3",
    "types-pyyaml>=6.0.12.20250915",
]
